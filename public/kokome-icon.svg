  <polygon points="61,22 67,14 74,26" fill="#F3E8FF" />
  <!-- Cheeks -->
  <circle cx="34" cy="58" r="5" fill="#FDA4AF" opacity="0.8" />
  <circle cx="66" cy="58" r="5" fill="#FDA4AF" opacity="0.8" />
  <!-- Sparkly eyes -->
  <ellipse cx="36" cy="50" rx="4.5" ry="6" fill="#FFFFFF" />
  <circle cx="37" cy="48" r="2" fill="#3B0764" />
  <circle cx="35" cy="51" r="1" fill="#FFFFFF" />
  <ellipse cx="64" cy="50" rx="4.5" ry="6" fill="#FFFFFF" />
  <circle cx="63" cy="48" r="2" fill="#3B0764" />
